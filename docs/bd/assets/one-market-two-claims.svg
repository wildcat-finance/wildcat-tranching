<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">One loan produces senior and junior participations</title>
  <desc id="desc">One named borrower facility supports senior and junior participation classes. Senior has first claim on realised value, senior exit requests clear before junior requests, and junior takes first loss.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#1c5c9e"/>
    </marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#0b2341}.sub{font:400 17px Arial,sans-serif;fill:#46596f}
      .h{font:700 20px Arial,sans-serif;fill:#0b2341}.t{font:400 16px Arial,sans-serif;fill:#24384f}
      .small{font:400 14px Arial,sans-serif;fill:#46596f}.line{stroke:#1c5c9e;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .box{fill:#fff;stroke:#173b66;stroke-width:2}.senior{fill:#ddebfa;stroke:#1c5c9e;stroke-width:3}
      .junior{fill:#fff0d6;stroke:#d28720;stroke-width:3}.neutral{fill:#eef2f5;stroke:#6b7d90;stroke-width:2}
    </style>
  </defs>
  <rect width="1200" height="675" fill="#faf8f3"/>
  <text class="title" x="60" y="64">One loan. Two tickets. Same borrower.</text>
  <text class="sub" x="60" y="96">Senior has first claim on value. Senior exit requests clear before junior. Junior takes first loss.</text>

  <rect class="box" x="60" y="230" width="190" height="120" rx="14"/>
  <text class="h" x="155" y="270" text-anchor="middle">Borrower</text>
  <text class="t" x="155" y="300" text-anchor="middle">One named credit</text>
  <text class="t" x="155" y="324" text-anchor="middle">One repayment source</text>

  <rect class="box" x="330" y="210" width="220" height="160" rx="14"/>
  <text class="h" x="440" y="254" text-anchor="middle">Underlying loan</text>
  <text class="t" x="440" y="286" text-anchor="middle">Interest and principal</text>
  <text class="t" x="440" y="312" text-anchor="middle">Cash comes back here</text>
  <text class="small" x="440" y="346" text-anchor="middle">One facility</text>

  <rect class="neutral" x="630" y="210" width="220" height="160" rx="14"/>
  <text class="h" x="740" y="252" text-anchor="middle">Participation facility</text>
  <text class="t" x="740" y="284" text-anchor="middle">One pool of value</text>
  <text class="t" x="740" y="310" text-anchor="middle">One cash waterfall</text>
  <text class="small" x="740" y="344" text-anchor="middle">Seniority · accounting · recovery</text>

  <rect class="senior" x="940" y="165" width="210" height="145" rx="14"/>
  <text class="h" x="1045" y="207" text-anchor="middle">Senior ticket</text>
  <text class="t" x="1045" y="239" text-anchor="middle">Annual simple target</text>
  <text class="t" x="1045" y="265" text-anchor="middle">First claim on value</text>
  <text class="small" x="1045" y="291" text-anchor="middle">Still exposed after junior is gone</text>

  <rect class="junior" x="940" y="365" width="210" height="145" rx="14"/>
  <text class="h" x="1045" y="407" text-anchor="middle">Junior ticket</text>
  <text class="t" x="1045" y="439" text-anchor="middle">Residual return</text>
  <text class="t" x="1045" y="465" text-anchor="middle">First realised loss</text>
  <text class="small" x="1045" y="491" text-anchor="middle">Exit requests after senior</text>

  <path class="line" d="M250 290H325"/>
  <path class="line" d="M550 290H625"/>
  <path class="line" d="M850 270C900 270 895 237 935 237"/>
  <path class="line" d="M850 310C900 310 895 437 935 437"/>

  <text class="small" x="288" y="276" text-anchor="middle">raises</text>
  <text class="small" x="892" y="215" text-anchor="middle">issues</text>

  <rect class="neutral" x="300" y="525" width="600" height="75" rx="12"/>
  <text class="h" x="600" y="558" text-anchor="middle">Both tickets</text>
  <text class="t" x="600" y="585" text-anchor="middle">Controlled transfer · asynchronous cash exit · same borrower risk</text>
  <text class="small" x="600" y="650" text-anchor="middle">Seniority changes payment and loss order. It does not change the borrower underneath.</text>
</svg>
