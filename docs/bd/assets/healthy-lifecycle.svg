<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Funding and cash exit lifecycle</title>
  <desc id="desc">Seven numbered steps show term agreement, junior and senior funding, loan performance, exit request, cash collection and holder payment.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1c5c9e"/></marker>
    <style>
      .title{font:700 32px Arial,sans-serif;fill:#0b2341}.sub{font:400 16px Arial,sans-serif;fill:#46596f}
      .n{font:700 21px Arial,sans-serif;fill:#fff}.h{font:700 17px Arial,sans-serif;fill:#0b2341}.t{font:400 14px Arial,sans-serif;fill:#24384f}
      .box{fill:#fff;stroke:#173b66;stroke-width:2}.num{fill:#1c5c9e}.line{stroke:#1c5c9e;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .note{fill:#dff2ec;stroke:#238c84;stroke-width:2}.warn{fill:#fff0d6;stroke:#d28720;stroke-width:2}
    </style>
  </defs>
  <rect width="1200" height="675" fill="#faf8f3"/>
  <text class="title" x="60" y="58">Fund once. Collect when the loan pays.</text>
  <text class="sub" x="60" y="88">Junior funds first loss. Senior funds above it. Neither class has cash-on-demand liquidity.</text>

  <path class="line" d="M155 205H285M425 205H555M695 205H825M965 205H1085"/>
  <path class="line" d="M1085 275C1085 365 960 390 925 420"/>
  <path class="line" d="M820 470H690M550 470H420"/>

  <g><rect class="box" x="55" y="135" width="200" height="140" rx="13"/><circle class="num" cx="82" cy="162" r="20"/><text class="n" x="82" y="169" text-anchor="middle">1</text><text class="h" x="155" y="169" text-anchor="middle">Agree the trade</text><text class="t" x="155" y="201" text-anchor="middle">Set senior return, junior</text><text class="t" x="155" y="224" text-anchor="middle">thickness, eligibility</text><text class="t" x="155" y="247" text-anchor="middle">and workout terms</text></g>
  <g><rect class="warn" x="285" y="135" width="200" height="140" rx="13"/><circle class="num" cx="312" cy="162" r="20"/><text class="n" x="312" y="169" text-anchor="middle">2</text><text class="h" x="385" y="169" text-anchor="middle">Junior funds</text><text class="t" x="385" y="201" text-anchor="middle">First-loss capital</text><text class="t" x="385" y="224" text-anchor="middle">lands before senior</text><text class="t" x="385" y="247" text-anchor="middle">Junior receives its interest</text></g>
  <g><rect class="box" x="555" y="135" width="200" height="140" rx="13"/><circle class="num" cx="582" cy="162" r="20"/><text class="n" x="582" y="169" text-anchor="middle">3</text><text class="h" x="655" y="169" text-anchor="middle">Senior funds</text><text class="t" x="655" y="201" text-anchor="middle">Only while the agreed</text><text class="t" x="655" y="224" text-anchor="middle">junior share remains</text><text class="t" x="655" y="247" text-anchor="middle">Senior receives its interest</text></g>
  <g><rect class="note" x="825" y="135" width="200" height="140" rx="13"/><circle class="num" cx="852" cy="162" r="20"/><text class="n" x="852" y="169" text-anchor="middle">4</text><text class="h" x="925" y="169" text-anchor="middle">Loan performs</text><text class="t" x="925" y="201" text-anchor="middle">Borrower pays interest</text><text class="t" x="925" y="224" text-anchor="middle">Senior target accrues</text><text class="t" x="925" y="247" text-anchor="middle">Junior owns the residual</text></g>

  <g><rect class="box" x="825" y="400" width="200" height="140" rx="13"/><circle class="num" cx="852" cy="427" r="20"/><text class="n" x="852" y="434" text-anchor="middle">5</text><text class="h" x="925" y="434" text-anchor="middle">Request cash</text><text class="t" x="925" y="466" text-anchor="middle">Holder submits an exit</text><text class="t" x="925" y="489" text-anchor="middle">and gives up the related</text><text class="t" x="925" y="512" text-anchor="middle">participation interest</text></g>
  <g><rect class="box" x="555" y="400" width="200" height="140" rx="13"/><circle class="num" cx="582" cy="427" r="20"/><text class="n" x="582" y="434" text-anchor="middle">6</text><text class="h" x="655" y="434" text-anchor="middle">Collect cash</text><text class="t" x="655" y="466" text-anchor="middle">Borrower repayment and</text><text class="t" x="655" y="489" text-anchor="middle">loan liquidity set timing</text><text class="t" x="655" y="512" text-anchor="middle">Partial cash is possible</text></g>
  <g><rect class="note" x="285" y="400" width="200" height="140" rx="13"/><circle class="num" cx="312" cy="427" r="20"/><text class="n" x="312" y="434" text-anchor="middle">7</text><text class="h" x="385" y="434" text-anchor="middle">Pay holders</text><text class="t" x="385" y="466" text-anchor="middle">Senior first across classes</text><text class="t" x="385" y="489" text-anchor="middle">FIFO within each class</text><text class="t" x="385" y="512" text-anchor="middle">Sanctioned holder uses escrow</text></g>

  <rect class="warn" x="55" y="400" width="170" height="140" rx="13"/>
  <text class="h" x="140" y="438" text-anchor="middle">What this is not</text>
  <text class="t" x="140" y="470" text-anchor="middle">No instant redemption</text>
  <text class="t" x="140" y="493" text-anchor="middle">No promised settlement date</text>
  <text class="t" x="140" y="516" text-anchor="middle">No buyer is guaranteed</text>

  <text class="sub" x="600" y="625" text-anchor="middle">New money requires a performing loan, sanctions clearance and the agreed eligibility policy.</text>
</svg>
