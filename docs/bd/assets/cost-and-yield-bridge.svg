<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Borrower cost and participation allocation are separate</title>
  <desc id="desc">The borrower pays loan interest plus the Wildcat protocol fee, with possible origination and arrears charges. The current prototype facility adds no second fee and divides value between senior and junior.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1c5c9e"/></marker>
    <style>
      .title{font:700 32px Arial,sans-serif;fill:#0b2341}.sub{font:400 16px Arial,sans-serif;fill:#46596f}
      .h{font:700 19px Arial,sans-serif;fill:#0b2341}.big{font:700 30px Arial,sans-serif;fill:#0b2341}.t{font:400 15px Arial,sans-serif;fill:#24384f}.tiny{font:400 13px Arial,sans-serif;fill:#46596f}
      .box{fill:#fff;stroke:#173b66;stroke-width:2}.blue{fill:#ddebfa;stroke:#1c5c9e;stroke-width:2}.amber{fill:#fff0d6;stroke:#d28720;stroke-width:2}.green{fill:#dff2ec;stroke:#238c84;stroke-width:2}
      .line{stroke:#1c5c9e;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="675" fill="#faf8f3"/>
  <text class="title" x="60" y="58">Borrower cost is not the participation split</text>
  <text class="sub" x="60" y="88">Keep loan pricing, protocol fees and participation allocation in separate columns.</text>

  <text class="h" x="255" y="145" text-anchor="middle">Borrower running cost</text>
  <rect class="box" x="55" y="170" width="400" height="280" rx="14"/>
  <rect class="blue" x="90" y="205" width="330" height="72" rx="10"/>
  <text class="big" x="180" y="250" text-anchor="middle">10%</text>
  <text class="t" x="300" y="244" text-anchor="middle">Loan lender APR</text>
  <rect class="amber" x="90" y="295" width="330" height="72" rx="10"/>
  <text class="big" x="180" y="340" text-anchor="middle">+1%</text>
  <text class="t" x="300" y="326" text-anchor="middle">Wildcat protocol fee at</text>
  <text class="tiny" x="300" y="348" text-anchor="middle">1,000 bips of lender interest</text>
  <line x1="90" y1="388" x2="420" y2="388" stroke="#173b66" stroke-width="2"/>
  <text class="big" x="180" y="430" text-anchor="middle">11%</text>
  <text class="t" x="300" y="424" text-anchor="middle">Running base-interest cost</text>
  <text class="tiny" x="255" y="475" text-anchor="middle">Illustration only · before origination or arrears charges</text>

  <path class="line" d="M455 310H565"/>
  <rect class="green" x="565" y="225" width="240" height="170" rx="14"/>
  <text class="h" x="685" y="265" text-anchor="middle">Underlying loan</text>
  <text class="t" x="685" y="300" text-anchor="middle">Interest, charges, liquidity</text>
  <text class="t" x="685" y="326" text-anchor="middle">and recovery start here</text>
  <text class="h" x="685" y="365" text-anchor="middle">Prototype facility fee: 0</text>

  <path class="line" d="M805 280H900"/>
  <path class="line" d="M805 340H900"/>
  <text class="h" x="1020" y="145" text-anchor="middle">Participation split</text>
  <rect class="blue" x="900" y="180" width="250" height="150" rx="14"/>
  <text class="h" x="1025" y="222" text-anchor="middle">Senior</text>
  <text class="t" x="1025" y="254" text-anchor="middle">Annual simple accounting target</text>
  <text class="t" x="1025" y="279" text-anchor="middle">First realised-value priority</text>
  <text class="tiny" x="1025" y="307" text-anchor="middle">Not the loan APR · not guaranteed</text>
  <rect class="amber" x="900" y="355" width="250" height="150" rx="14"/>
  <text class="h" x="1025" y="397" text-anchor="middle">Junior</text>
  <text class="t" x="1025" y="429" text-anchor="middle">Residual after senior</text>
  <text class="t" x="1025" y="454" text-anchor="middle">First realised loss</text>
  <text class="tiny" x="1025" y="482" text-anchor="middle">No promised residual return</text>

  <rect class="box" x="280" y="530" width="640" height="90" rx="12"/>
  <text class="h" x="600" y="565" text-anchor="middle">Do not collapse the numbers</text>
  <text class="t" x="600" y="592" text-anchor="middle">Price borrower cost on the loan. Negotiate senior and junior economics in the capital stack.</text>
</svg>
